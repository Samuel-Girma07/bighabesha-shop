name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck · Build · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck bot
        run: pnpm --filter bot exec tsc --noEmit

      - name: Typecheck webapp
        run: pnpm --filter webapp exec tsc --noEmit

      - name: Build all packages
        run: pnpm -r build

      - name: Verify production i18n assets in dist
        run: |
          test -f bot/dist/i18n/en.json || { echo "missing bot/dist/i18n/en.json"; exit 1; }
          ls bot/dist/db/migrations/*.sql >/dev/null || { echo "missing dist migrations"; exit 1; }
          echo "dist asset bundling OK"

      - name: Test bot
        run: pnpm --filter bot test

      - name: Test webapp
        run: pnpm --filter webapp test
